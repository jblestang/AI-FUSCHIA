[workspace]
resolver = "2"
members = [
    "libs/fidl-fuchsia-net-common",
    "libs/net-types-macros",
    "libs/net-types",
    "libs/net-declare-macros",
    "libs/net-declare",
    "libs/internet-checksum",
    "libs/explicit",
    "libs/diagnostics-traits",
    "libs/replace-with",
    "libs/packet",
    "libs/packet-formats",
    "libs/ip-test-macro",
    "libs/test_util",
    "libs/proptest-support",
    "netstack3/core/hashmap",
    "netstack3/core/lock-order",
    "netstack3/core/macros",
    "netstack3/core/teststd",
    "netstack3/core/sync",
    "netstack3/core/base",
    "netstack3/core/trace",
    "netstack3/core/filter",
    "netstack3/core/ip",
    "netstack3/core/device",
    "netstack3/core/datagram",
    "netstack3/core/tcp",
    "netstack3/core/udp",
    "netstack3/core/icmp_echo",
    "netstack3/core",
    "netstack3/benchmarks",
]

[workspace.package]
edition = "2024"
license = "BSD-3-Clause"
version = "0.1.0"

[workspace.dependencies]
arc-swap = "1.7"
arrayvec = "0.7"
assert_matches = "1.5"
bitflags = "2.9"
byteorder = "1.5"
cfg-if = "1.0"
derivative = "2.2"
either = { version = "1.15", default-features = false }
digest = "0.10"
hmac = "0.12"
log = "0.4"
lru-cache = "0.1"
once_cell = "1.21"
proc-macro2 = "1.0"
quote = "1.0"
rand = "0.9"
rand_xorshift = "0.4"
ref-cast = "1.0"
siphasher = "1.0"
smallvec = { version = "1.15", features = ["const_generics"] }
sha2 = "0.10"
static_assertions = "1.1"
strum = { version = "0.26", default-features = false, features = ["derive"] }
strum_macros = "0.26"
syn = { version = "2.0", features = ["full", "visit-mut"] }
thiserror = "2.0"
zerocopy = { version = "0.8", features = ["derive"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
